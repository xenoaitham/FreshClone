[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshclone"
version = "0.1.0"
description = "Clone a repo into a disposable container and run every command in its README, in order, as a brand-new contributor would."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Freshclone contributors" }]
keywords = ["docs", "readme", "onboarding", "docker", "ci", "developer-experience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/freshclone/freshclone"
Issues = "https://github.com/freshclone/freshclone/issues"

[project.scripts]
freshclone = "freshclone.cli:main"

[tool.setuptools.packages.find]
include = ["freshclone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
